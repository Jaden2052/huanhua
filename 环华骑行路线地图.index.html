// ========== WGS84 -> GCJ02 坐标转换（高德/腾讯地图使用 GCJ02 火星坐标） ==========
function wgs84ToGcj02(lat, lng) {
  const a = 6378245.0, ee = 0.00669342162296594323;
  const outOfChina = (lng < 72.004 || lng > 137.8347) || (lat < 0.8293 || lat > 55.8271);
  if (outOfChina) return [lat, lng];
  let dLat = transformLat(lng - 105.0, lat - 35.0);
  let dLng = transformLng(lng - 105.0, lat - 35.0);
  const radLat = lat / 180.0 * Math.PI;
  let magic = Math.sin(radLat); magic = 1 - ee * magic * magic;
  const sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
  dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
  return [lat + dLat, lng + dLng];
}
function transformLat(x, y) {
  let r = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
  r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2/3;
  r += (20*Math.sin(y*Math.PI) + 40*Math.sin(y/3*Math.PI)) * 2/3;
  r += (160*Math.sin(y/12*Math.PI) + 320*Math.sin(y*Math.PI/30.0)) * 2/3;
  return r;
}
function transformLng(x, y) {
  let r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
  r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2/3;
  r += (20*Math.sin(x*Math.PI) + 40*Math.sin(x/3*Math.PI)) * 2/3;
  r += (150*Math.sin(x/12*Math.PI) + 300*Math.sin(x/30.0*Math.PI)) * 2/3;
  return r;
}
// 把所有节点的 WGS84 坐标转成 GCJ02，确保和高德底图对齐
route.forEach(r => { r.coord = wgs84ToGcj02(r.coord[0], r.coord[1]); });

// 使用高德中文地图（带中文路名/城市名）

  subdomains: '1234',
  attribution: '高德地图 © AutoNavi',
  maxZoom: 18
}).addTo(map);

// 计算总里程

document.querySelector('.stats .stat:nth-child(2) .num').textContent = total.toLocaleString();
document.querySelector('.stats .stat:nth-child(3) .num').textContent = route.length;

// 绘制连线（先画白色描边，再画橙色主线，亮色底图上更清晰）
const latlngs = route.map(r => r.coord);
L.polyline(latlngs, {
  color: '#ffffff', weight: 6, opacity: 0.9, lineJoin: 'round'
}).addTo(map);

  color: '#ff5722',
  weight: 3.5,
  opacity: 1,
  dashArray: '6,4',
  lineJoin: 'round'
}).addTo(map);

// 标记点
const markers = [];
const numberLabels = [];

  let color = '#ff6b35';
  let size = 8;
  if (r.rest) { color = '#ffb454'; size = 11; }
  if (r.type === 'start' || r.type === 'end') { color = '#e74c3c'; size = 14; }

  const marker = L.circleMarker(r.coord, {
    radius: size,
    fillColor: color,
    color: '#fff',
    weight: 1.5,
    fillOpacity: 0.95
  }).addTo(map);

  marker.bindPopup(
    `<div><span class="day-badge">${r.day}</span><b>${r.name}</b></div>
     <div style="margin-top:4px;color:#555">里程 ${r.dist} km</div>
     <div style="color:#888;font-size:12px">${r.note}</div>
     <div style="color:#aaa;font-size:11px;margin-top:4px">第 ${i} 个节点</div>`
  );

  // 在标记旁加序号（缩放小于 6 时隐藏，避免遮挡）
  const label = L.marker(r.coord, {
    icon: L.divIcon({
      className: 'num-label',
      html: `<div>${i}</div>`,
      iconSize: [22, 18],
      iconAnchor: [11, 9]
    })
  }).addTo(map);

  markers.push(marker);
  numberLabels.push(label);
});

// 缩放控制：放大才显示序号
function toggleNumberLabels() {
  const show = map.getZoom() >= 6;
  numberLabels.forEach(l => {
    const el = l.getElement();
    if (el) el.style.display = show ? 'block' : 'none';
  });
}
map.on('zoomend', toggleNumberLabels);
setTimeout(toggleNumberLabels, 200);

// 适配视图到所有点
map.fitBounds(L.latLngBounds(latlngs).pad(0.05));

// 侧边栏列表
const list = document.getElementById('list');
route.forEach((r, i) => {
  const li = document.createElement('li');
  li.innerHTML = `
    <span class="day">${r.day}</span>
    <span class="route">${i === 0 ? '' : route[i-1].name + ' → '}${r.name}</span>
    <span class="meta">${r.dist} km · ${r.note}</span>
  `;
  li.addEventListener('click', () => {
    document.querySelectorAll('#list li').forEach(el => el.classList.remove('active'));
    li.classList.add('active');
    map.setView(r.coord, 7, { animate: true });
    markers[i].openPopup();
  });
  list.appendChild(li);
});
</script>
</body>
</html>
